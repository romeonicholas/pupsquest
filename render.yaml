services:
  - type: web
    name: pupsquest
    runtime: image
    image:
      url: ghcr.io/romeonicholas/pupsquest:latest
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    dockerCommand: sh -c "node drizzle/migrate.ts && node drizzle/seeds/index.ts && node server.ts"
    envVars:
      - key: APP_MODE
        value: online
      - key: DATABASE_URL
        fromDatabase:
          name: pupsquest-db
          property: connectionString

databases:
  - name: pupsquest-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
